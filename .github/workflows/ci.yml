name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Lint + Format in einem Lauf; --error-on-warnings bewusst NICHT gesetzt,
      # solange noNonNullAssertion/noExplicitAny als Warnung geführt werden.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Baut die vier Entries und prüft, dass das gebaute ESM headless unter
      # Node rendert (kein jsdom) — die Headless-Garantie des static tier.
      - run: npm run verify
